name: Deploy to Cloudflare Pages

# データは public/data/ にコミット済みのものをそのまま配信する。
# ビルド時に外部の公式サイトへ取りにいかない（区のサイト都合でデプロイが壊れないように）。
# 仕様: spec.md 3.6 / DECISIONS D-09
#
# 必要なシークレット（GitHub の Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN … Cloudflare の「Cloudflare Pages: 編集」権限を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
# 未設定の場合、デプロイ手順は自動でスキップされ、テストとビルドだけが走る。
# 手元からは `npm run deploy:cf` で直接デプロイできる。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 判定エンジンのテスト
        run: npm test

      - name: 型チェック
        run: npx tsc -b

      - name: ビルド
        run: npm run build

      - name: 解説ファイルを同梱する
        run: cp explain.html dist/explain.html

      - name: シークレットの有無を確認する
        id: secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイはスキップします"
          fi

      - name: Cloudflare Pages へデプロイ
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ring --branch main
